<!doctype html>
<meta charset="utf-8" />
<title>MSE Test Page</title>
<meta name="robots" content="noindex" />
<script>
  // Old URLs used relative srcs like "assets/media/x.mp4"; make them root-relative for /mse/.
  var params = new URLSearchParams(location.search);
  var src = params.get("src");
  if (src && !/^(\/|[a-z]+:)/i.test(src)) params.set("src", "/" + src);
  var query = params.toString();
  location.replace("/mse/" + (query ? "?" + query : "") + location.hash);
</script>
<noscript><a href="/mse/">MSE Test Page</a></noscript>
